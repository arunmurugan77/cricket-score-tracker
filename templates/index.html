<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🏏 Cricket Score Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="app-header">

        <img
            src="{{ url_for('static', filename='images/profile.jpg') }}"
            alt="Profile"
            class="profile-img"
        >

        <div class="header-text">

            <h1>🏏 Cricket Score Tracker</h1>

            <p>Live Match Scoring</p>

        </div>

    </div>



    <!-- =========================
         MATCH SETUP
    ========================== -->

    <div class="card setup-card">

        <div class="section-title">

            <h2>⚙️ Match Setup</h2>

            <p>
                Enter match details to start scoring
            </p>

        </div>



        <!-- TEAM -->

        <div class="input-group player-input">

            <label for="team">
                Team Name
            </label>

            <input
                type="text"
                id="team"
                placeholder="Enter team name"
                autocomplete="off"
            >

            <div
                id="teamSuggestions"
                class="suggestions"
            ></div>

        </div>



        <!-- STRIKER -->

        <div class="input-group player-input">

            <label for="striker">
                Opening Batsman
            </label>

            <input
                type="text"
                id="striker"
                placeholder="Enter striker name"
                autocomplete="off"
            >

            <div
                id="strikerSuggestions"
                class="suggestions"
            ></div>

        </div>



        <!-- NON STRIKER -->

        <div class="input-group player-input">

            <label for="non_striker">
                Non-Striker
            </label>

            <input
                type="text"
                id="non_striker"
                placeholder="Enter non-striker name"
                autocomplete="off"
            >

            <div
                id="nonStrikerSuggestions"
                class="suggestions"
            ></div>

        </div>



        <!-- OVERS -->

        <div class="input-group">

            <label for="total_overs">
                Total Overs
            </label>

            <input
                type="number"
                id="total_overs"
                placeholder="Example: 10"
                min="1"
            >

        </div>



        <!-- START -->

        <button
            class="start-btn"
            onclick="startMatch()"
        >
            ▶ Start Match
        </button>

        <a
            href="{{ url_for('history') }}"
            class="history-btn-landing"
        >
            📊 View Match History
        </a>


    </div>


</div>



<script>

    // ==========================================
    // Team Suggestions
    // ==========================================

    function saveTeamName(teamName) {
        if (!teamName) {
            return;
        }
        try {
            const saved = JSON.parse(
                localStorage.getItem("cricketTeamNames") || "[]"
            );
            const cleaned = saved.filter(
                team => team.toLowerCase() !== teamName.toLowerCase()
            );
            cleaned.unshift(teamName);
            const finalList = cleaned.slice(0, 30); // Store up to 30 unique teams
            localStorage.setItem(
                "cricketTeamNames",
                JSON.stringify(finalList)
            );
        }
        catch (error) {
            console.log("Team save error:", error);
        }
    }

    // ==========================================
    // Delete Team Name Locally
    // ==========================================

    function deleteTeamNameLocally(teamName) {
        if (!teamName) return;
        try {
            const saved = JSON.parse(
                localStorage.getItem("cricketTeamNames") || "[]"
            );
            const cleaned = saved.filter(
                name => name.toLowerCase() !== teamName.toLowerCase()
            );
            localStorage.setItem(
                "cricketTeamNames",
                JSON.stringify(cleaned)
            );
        } catch (error) {
            console.log("Team local delete error:", error);
        }
    }

    function setupTeamSuggestions() {
        const input = document.getElementById("team");
        const suggestions = document.getElementById("teamSuggestions");

        if (!input || !suggestions) {
            return;
        }

        const renderTeamSuggestions = (list) => {
            suggestions.innerHTML = "";
            list.slice(0, 10).forEach(team => {
                const item = document.createElement("div");
                item.className = "suggestion-item";

                // Text label
                const nameSpan = document.createElement("span");
                nameSpan.textContent = team;
                item.appendChild(nameSpan);

                // Delete 'x' button
                const deleteBtn = document.createElement("span");
                deleteBtn.className = "suggestion-delete-btn";
                deleteBtn.innerHTML = "×";
                deleteBtn.title = "Delete team";

                deleteBtn.onclick = function (e) {
                    e.stopPropagation(); // Prevent select team trigger
                    if (confirm("⚠️ Delete team '" + team + "' from suggestions?")) {
                        deleteTeamNameLocally(team);
                        updateSuggestions(); // Reload list
                    }
                };

                item.appendChild(deleteBtn);

                // Long Press (Mobile Touch & Desktop Mouse Hold)
                let pressTimer;
                let isLongPress = false;

                const startPress = (e) => {
                    clearTimeout(pressTimer);
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        if (confirm("⚠️ Delete team '" + team + "' from suggestions?")) {
                            deleteTeamNameLocally(team);
                            updateSuggestions();
                        }
                    }, 750);
                };

                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                // Touch Events (Mobile)
                item.addEventListener("touchstart", startPress, { passive: true });
                item.addEventListener("touchend", cancelPress);
                item.addEventListener("touchmove", cancelPress);
                item.addEventListener("touchcancel", cancelPress);

                // Mouse Events (Desktop)
                item.addEventListener("mousedown", (e) => {
                    if (e.button === 0) startPress(e);
                });
                item.addEventListener("mouseup", cancelPress);
                item.addEventListener("mouseleave", cancelPress);

                // Click item to select
                item.onclick = function () {
                    if (isLongPress) {
                        isLongPress = false;
                        return;
                    }
                    input.value = team;
                    suggestions.innerHTML = "";
                };

                suggestions.appendChild(item);
            });
        };

        const updateSuggestions = () => {
            const query = input.value.trim().toLowerCase();
            
            if (query.length === 0) {
                suggestions.innerHTML = "";
                return;
            }

            try {
                const savedTeams = JSON.parse(
                    localStorage.getItem("cricketTeamNames") || "[]"
                );

                // Filter duplicates
                const uniqueTeams = [];
                savedTeams.forEach(name => {
                    if (name && !uniqueTeams.some(u => u.toLowerCase() === name.toLowerCase())) {
                        uniqueTeams.push(name);
                    }
                });

                // Match starting with query
                const matched = uniqueTeams.filter(team =>
                    team.toLowerCase().startsWith(query)
                );

                renderTeamSuggestions(matched);
            }
            catch (error) {
                console.log("Team suggestion error:", error);
            }
        };

        input.addEventListener("input", updateSuggestions);

        document.addEventListener("click", function (event) {
            if (event.target !== input && !suggestions.contains(event.target)) {
                suggestions.innerHTML = "";
            }
        });
    }


    // ==========================================
    // Player Suggestions
    // ==========================================

    // ==========================================
    // Save Player Name Locally
    // ==========================================

    function savePlayerNameLocally(playerName) {
        if (!playerName) {
            return;
        }
        try {
            const saved = JSON.parse(
                localStorage.getItem("cricketPlayerNames") || "[]"
            );
            const cleaned = saved.filter(
                name => name.toLowerCase() !== playerName.toLowerCase()
            );
            cleaned.unshift(playerName);
            const finalList = cleaned.slice(0, 30); // Store up to 30 unique names
            localStorage.setItem(
                "cricketPlayerNames",
                JSON.stringify(finalList)
            );
        } catch (error) {
            console.log("Player name save error:", error);
        }
    }

    // ==========================================
    // Player Suggestions
    // ==========================================

    // ==========================================
    // Delete Player Name (LocalStorage and DB)
    // ==========================================

    async function deletePlayerName(playerName) {
        if (!playerName) return;

        // 1. Delete from Local Storage
        try {
            const saved = JSON.parse(
                localStorage.getItem("cricketPlayerNames") || "[]"
            );
            const cleaned = saved.filter(
                name => name.toLowerCase() !== playerName.toLowerCase()
            );
            localStorage.setItem(
                "cricketPlayerNames",
                JSON.stringify(cleaned)
            );
        } catch (error) {
            console.log("Local delete error:", error);
        }

        // 2. Delete from Database
        try {
            await fetch("/delete_player", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ player_name: playerName })
            });
        } catch (error) {
            console.log("DB delete error:", error);
        }
    }

    // ==========================================
    // Player Suggestions
    // ==========================================

    function setupPlayerSuggestions(inputId, suggestionsId) {
        const input = document.getElementById(inputId);
        const suggestions = document.getElementById(suggestionsId);

        if (!input || !suggestions) {
            return;
        }

        const renderSuggestions = (list) => {
            suggestions.innerHTML = "";
            list.slice(0, 10).forEach(player => {
                const item = document.createElement("div");
                item.className = "suggestion-item";

                // Text label
                const nameSpan = document.createElement("span");
                nameSpan.textContent = player;
                item.appendChild(nameSpan);

                // Delete 'x' button
                const deleteBtn = document.createElement("span");
                deleteBtn.className = "suggestion-delete-btn";
                deleteBtn.innerHTML = "×";
                deleteBtn.title = "Delete player";

                deleteBtn.onclick = function (e) {
                    e.stopPropagation(); // Prevent trigger parent onclick selection
                    if (confirm("⚠️ Delete player '" + player + "' from suggestions?")) {
                        deletePlayerName(player).then(() => {
                            updateSuggestions(); // Reload suggestions list
                        });
                    }
                };

                item.appendChild(deleteBtn);

                // Long Press (Mobile Touch & Desktop Mouse Hold)
                let pressTimer;
                let isLongPress = false;

                const startPress = (e) => {
                    clearTimeout(pressTimer);
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        if (confirm("⚠️ Delete player '" + player + "' from suggestions?")) {
                            deletePlayerName(player).then(() => {
                                updateSuggestions();
                            });
                        }
                    }, 750); // 750ms threshold
                };

                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                // Touch Events (Mobile)
                item.addEventListener("touchstart", startPress, { passive: true });
                item.addEventListener("touchend", cancelPress);
                item.addEventListener("touchmove", cancelPress);
                item.addEventListener("touchcancel", cancelPress);

                // Mouse Events (Desktop)
                item.addEventListener("mousedown", (e) => {
                    if (e.button === 0) startPress(e);
                });
                item.addEventListener("mouseup", cancelPress);
                item.addEventListener("mouseleave", cancelPress);

                // Click item to select (only if it wasn't a long press)
                item.onclick = function () {
                    if (isLongPress) {
                        isLongPress = false;
                        return;
                    }
                    input.value = player;
                    suggestions.innerHTML = "";
                };

                suggestions.appendChild(item);
            });
        };

        const updateSuggestions = async () => {
            const query = input.value.trim().toLowerCase();
            
            if (query.length === 0) {
                suggestions.innerHTML = "";
                return;
            }

            // 1. Get matches from Local Storage (ensuring distinct names and startsWith match)
            let localMatched = [];
            try {
                const savedPlayers = JSON.parse(
                    localStorage.getItem("cricketPlayerNames") || "[]"
                );
                
                // Get unique items
                const uniqueSaved = [];
                savedPlayers.forEach(name => {
                    if (name && !uniqueSaved.some(u => u.toLowerCase() === name.toLowerCase())) {
                        uniqueSaved.push(name);
                    }
                });

                // Match starting with query
                localMatched = uniqueSaved.filter(name =>
                    name.toLowerCase().startsWith(query)
                );
            } catch (error) {
                console.log("Local suggestions error:", error);
            }

            // Show local matches instantly (0ms latency!)
            renderSuggestions(localMatched);

            // 2. Fetch matches from Server Database asynchronously
            try {
                const response = await fetch(
                    "/players?search=" + encodeURIComponent(query)
                );
                const dbMatched = await response.json();

                // Race condition check: If input query has changed, or suggestions box is closed, discard this response
                const currentQuery = input.value.trim().toLowerCase();
                if (currentQuery !== query || suggestions.innerHTML === "") {
                    return;
                }

                // Combine, removing duplicates
                const combined = [...localMatched];
                dbMatched.forEach(name => {
                    if (!combined.some(c => c.toLowerCase() === name.toLowerCase())) {
                        combined.push(name);
                    }
                });

                // Update layout with the combined list
                renderSuggestions(combined);
            } catch (error) {
                console.log("DB suggestions error:", error);
            }
        };

        input.addEventListener("input", updateSuggestions);

        // Close suggestions when clicking elsewhere
        document.addEventListener("click", function (event) {
            if (event.target !== input && !suggestions.contains(event.target)) {
                suggestions.innerHTML = "";
            }
        });
    }



    // ==========================================
    // Start Match
    // ==========================================

    function startMatch() {

        const team =
            document
                .getElementById("team")
                .value
                .trim();


        const striker =
            document
                .getElementById("striker")
                .value
                .trim();


        const nonStriker =
            document
                .getElementById("non_striker")
                .value
                .trim();


        const totalOvers =
            parseInt(
                document
                    .getElementById("total_overs")
                    .value
            );



        // ======================================
        // Validation
        // ======================================

        if (
            team === "" ||
            striker === "" ||
            nonStriker === "" ||
            isNaN(totalOvers) ||
            totalOvers <= 0
        ) {

            alert(
                "Please fill all match details correctly."
            );

            return;

        }



        // ======================================
        // Save Match Setup
        // ======================================

        saveTeamName(team);
        savePlayerNameLocally(striker);
        savePlayerNameLocally(nonStriker);

        const cricketMatchSetup = {
            team: team,
            striker: striker,
            nonStriker: nonStriker,
            totalOvers: totalOvers
        };

        sessionStorage.setItem(
            "cricketMatchSetup",
            JSON.stringify(cricketMatchSetup)
        );



        // ======================================
        // Go to Live Score Page
        // ======================================

        window.location.href =
            "/score";

    }



    // ==========================================
    // Enable Suggestions
    // ==========================================

    setupTeamSuggestions();

    setupPlayerSuggestions(
        "striker",
        "strikerSuggestions"
    );


    setupPlayerSuggestions(
        "non_striker",
        "nonStrikerSuggestions"
    );

    // ==========================================
    // Close Suggestions on Focus Change
    // ==========================================
    const allInputs = ["team", "striker", "non_striker", "total_overs"];
    allInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener("focus", function() {
                if (id !== "team") {
                    const teamSuggestions = document.getElementById("teamSuggestions");
                    if (teamSuggestions) teamSuggestions.innerHTML = "";
                }
                if (id !== "striker") {
                    const strikerSuggestions = document.getElementById("strikerSuggestions");
                    if (strikerSuggestions) strikerSuggestions.innerHTML = "";
                }
                if (id !== "non_striker") {
                    const nonStrikerSuggestions = document.getElementById("nonStrikerSuggestions");
                    if (nonStrikerSuggestions) nonStrikerSuggestions.innerHTML = "";
                }
            });
        }
    });

</script>


</body>

</html>
